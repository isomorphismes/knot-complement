name: Agda original-source translation

on:
  push:
    branches:
      - translate/original-agda
  pull_request:
    paths:
      - 'translation/agda-original/**'
      - '.github/workflows/agda-original-translation.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Agda
        run: |
          sudo apt-get update
          sudo apt-get install -y agda-bin

      - name: Typecheck full direct translation
        run: |
          agda             -i translation/agda-original             translation/agda-original/GeometryCenter/All.agda
